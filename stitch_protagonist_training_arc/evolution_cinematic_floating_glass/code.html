<style>
        .glitch-text {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #9a0002;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: 2px 0 #1f1b16;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 85px, 0); }
            20% { clip: rect(4px, 9999px, 14px, 0); }
            40% { clip: rect(66px, 9999px, 94px, 0); }
            60% { clip: rect(32px, 9999px, 5px, 0); }
            80% { clip: rect(81px, 9999px, 49px, 0); }
            100% { clip: rect(10px, 9999px, 73px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(12px, 9999px, 59px, 0); }
            20% { clip: rect(89px, 9999px, 3px, 0); }
            40% { clip: rect(45px, 9999px, 27px, 0); }
            60% { clip: rect(76px, 9999px, 98px, 0); }
            80% { clip: rect(23px, 9999px, 16px, 0); }
            100% { clip: rect(54px, 9999px, 82px, 0); }
        }
        .aura-pulse {
            animation: pulse-red 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px 5px rgba(154, 0, 2, 0.2); }
            50% { box-shadow: 0 0 50px 15px rgba(154, 0, 2, 0.6); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 27, 22, 0.1);
        }
        .glass-button {
            background: rgba(154, 0, 2, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(154, 0, 2, 0.3);
        }
    </style>
