<style>
        body { background-color: #EFE6DE; } /* Enforcing requested background */
        
        .glass-card {
            background: rgba(255, 255, 255, 0.23);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.05) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 1s ease-in-out;
            stroke-dasharray: 440;
            stroke-dashoffset: 110; /* 75% of 440 */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="text-on-surface antialiased overflow-x-hidden pt-20 pb-28 md:pb-12">

<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-on-surface/10 flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<img alt="User Avatar" class="w-8 h-8 rounded-full border border-on-surface/20 object-cover" data-alt="A small, circular avatar portrait of a futuristic runner, tightly cropped. The lighting is harsh and dramatic, reflecting a tech-noir aesthetic with deep blacks and stark whites. The mood is intense and focused. The overall style is minimalist and high-contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR3lfKDV9lCBxKdan6y0IGeomFCEKrIep0mrvCW3aTWRT50pcDNHFXdk0vGf1miWAbYeFYsaZHevYQUYnOBKezRHM0cy3foCIpM_FY9UD_zy3ZDZTIjFd7R71AVFO10SxmToL-GtJWYk6M-NtuVOshP5BAI3CxQa9IARahfJmNn55CUC3Te5erFGt6_Dq-Pla2iPowy1vsiUEqZ3oB1DvCpaE-G13PJkVkK0ReSspr2DOKNj_gtYehFHH2a6NvUxvzHNgskwu0P0IN"/>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</header>
<main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop space-y-stack-lg">
<!-- PILOT IDENTITY & SYNC -->
<section class="flex flex-col items-center justify-center pt-8">
<div class="relative w-48 h-48 mb-6">
<!-- Sync Ring -->
<svg class="absolute inset-0 w-full h-full progress-ring" viewbox="0 0 160 160">
<circle cx="80" cy="80" fill="none" r="70" stroke="rgba(31, 27, 22, 0.1)" stroke-width="4"></circle>
<circle class="progress-ring-circle" cx="80" cy="80" fill="none" r="70" stroke="#9A0002" stroke-linecap="butt" stroke-width="6"></circle>
</svg>
<!-- Central Avatar -->
<div class="absolute inset-2 rounded-full overflow-hidden border-2 border-primary-container">
<img alt="Pilot 04" class="w-full h-full object-cover grayscale contrast-125" data-alt="A stark, high-contrast portrait of an athlete in profile, heavily stylized in a tech-noir aesthetic. The image is mostly black and white with an intense, gritty texture. The lighting is dramatic, carving out sharp facial features against a void-like background. The mood is determined and clinical." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQzZBzO5ElLPh1Z1dwji2X-DTm-FDvImVVkw4bYIy9VpljKt1EEk6J1UB5N996ldL9VHyQ_KJ7eayh6BmNsfHYl1TtYeIihbuf9BVxqF16o172QpwhISHhvt9ay4TE3KjOxhpdfaA79FTwjIcY5JMbur_yqwDbn1jNwJYq7WXKdtK15wjqivZ454H5ffum-bdhrW-OtkHAWcv-v8Cc5r_Im8-_6EVCQmIBYOIuSestDkQXBV4jVmlXJk_FGpy2mcjUA7H5sY4ZPc_U"/>
</div>
</div>

<div class="inline-flex items-center gap-2 border border-on-surface px-4 py-1">
<span class="w-2 h-2 bg-primary-container rounded-full animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary-container tracking-widest uppercase">75% SYNC DETECTED</span>
</div>
</div>
</section>
<!-- STATS BENTO -->
<section class="grid grid-cols-2 gap-4">
<!-- Calories -->
<div class="glass-card p-6 flex flex-col justify-between h-32">

<span class="material-symbols-outlined text-primary-container text-sm">local_fire_department</span>
</div>
<div class="flex items-baseline gap-1">

<span class="font-label-sm text-label-sm text-on-surface-variant">KCAL</span>
</div>
</div>
<!-- Streak -->

<img alt="Urban Run" class="w-full h-full object-cover opacity-40 grayscale mix-blend-multiply" data-alt="A grim, atmospheric view of an empty urban street at night, suitable for a tech-noir setting. The scene is dominated by deep shadows and stark, artificial lighting casting long, jagged shapes. The overall color palette is muted, relying on grays and blacks with a hint of sickly yellow light. It feels isolating and challenging." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfSFsFFlFKQbtpmzQyJUpHxhm2eEFQUViXdcUTuFMYj31L_M1ECNREH_6q25Tl81LcXhLrZzO46q_kE_QFxg6nxMyRYVn31L_S2VsazAYts504mITc_g0Voj15SQouG0gIOflp1d4cpBkj5fN05OGWaB4cAiPwFo75jXU-VI5Ygmd_-6FL19dyouxtDCyoKL-_xYgH6CB32LwTaVxdhyCUdn4XHMah03W1M3PIP88a5u7NwhT6IiwNew8bZfn4Fdvn1oOjUoDDwVUD"/>

<div class="border border-on-surface px-3 py-1 bg-surface/50 backdrop-blur-sm">

<div class="space-y-2">
<h3 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase text-primary-container leading-none">10KM ABYSSAL RUN</h3>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md">Navigate Sector 7. Maintain pace above 5:30/km to avoid systemic failure. Route locked.</p>
</div>
<button class="w-full md:w-auto bg-primary-container text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 px-8 border-none hover:bg-surface-tint transition-colors duration-200 flex items-center justify-center gap-2">
<span>START MISSION</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</section>
